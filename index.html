    <script>
        // --- Функция для правильного склонения слов ---
        function getNounForm(number, forms) {
            // forms: ['единственное число', 'родительный падеж ед. числа', 'родительный падеж мн. числа']
            // Пример: ['день', 'дня', 'дней']
            number = Math.abs(number) % 100; // Берем последние две цифры для исключений (11-19)
            var n1 = number % 10; // Берем последнюю цифру

            if (number > 10 && number < 20) { // Если число 11-19
                return forms[2]; // Например, "дней", "часов"
            }
            if (n1 > 1 && n1 < 5) { // Если оканчивается на 2, 3, 4 (кроме 12-14)
                return forms[1]; // Например, "дня", "часа"
            }
            if (n1 == 1) { // Если оканчивается на 1 (кроме 11)
                return forms[0]; // Например, "день", "час"
            }
            return forms[2]; // Все остальные случаи (0, 5-9)
        }

        // --- Словарные формы для каждого слова ---
        const forms = {
            days: ['день', 'дня', 'дней'],
            hours: ['час', 'часа', 'часов'],
            minutes: ['минута', 'минуты', 'минут'],
            seconds: ['секунда', 'секунды', 'секунд']
        };

        // --- Укажите точную дату и время вашей свадьбы ---
        const weddingDate = new Date("August 21, 2026 16:00:00").getTime();

        const timerInterval = setInterval(function () {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Обновляем числа
            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            // Обновляем окончания слов
            document.getElementById("daysText").innerHTML = getNounForm(days, forms.days);
            document.getElementById("hoursText").innerHTML = getNounForm(hours, forms.hours);
            document.getElementById("minutesText").innerHTML = getNounForm(minutes, forms.minutes);
            document.getElementById("secondsText").innerHTML = getNounForm(seconds, forms.seconds);

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById("timer").innerHTML = "<h3 style='color: #58181f; font-weight: normal; font-size: 1.2em;'>СВАДЬБА НАЧАЛАСЬ!</h3>";
            }
        }, 1000);
